{
  // Agent 模式专属配置
  // dataset 可选：
  // lite         SWE-bench Lite，300 条，成本最低，适合快速验证
  // verified     SWE-bench Verified，500 条，人工校验过的问题和补丁
  // full         完整 SWE-bench，约 2294 条，评测成本最高
  // multilingual 多语言 SWE-bench，覆盖非英语仓库/问题
  "dataset": "lite",

  // 按数据集原始顺序取前 N 条；0 表示全部
  "count": 1,

  // 单个 instance 允许的最大 agent 步数
  "step_limit": 200,

  // Agent 输出目录
  "work_dir": "outputs/agent",

  // Agent 运行阶段：
  // infer = 只推理
  // eval  = 只评测
  // all   = 推理 + 评测
  "run_mode": "all"
}
