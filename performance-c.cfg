{
  // Performance concat 拼接压测专属配置
  // 生成/查找压测数据集的目录
  "dataset_dir": "datasets/performance",

  // Excel 结果目录
  "result_dir": "results/performance",

  // 输入 token 长度列表；会与并发列表做笛卡尔积
  "input_len": [16384, 65536, 200000],

  // 并发数列表；实际数据集 bs = 并发数 * 4
  "concurrencies": [1, 8, 16, 32],

  // 默认输出 token 长度；null 表示使用模型配置里的默认值
  "default_max_out_len": 1024,

  // 默认请求速率；null 表示不改，0 表示尽量打满
  "default_request_rate": null,

  // 默认前缀缓存共享比例；null 表示普通数据集
  // 例如 85 表示生成 xxx-pfx85.jsonl，前 85% token 跨样本共享
  "default_pfx": null,

  // 数据集类型可选：gsm / sharegpt / swebench
  "dataset_types": ["sharegpt"],

  // 各数据集的原始文件路径；留空时自动下载到 raw_dataset_dir
  "raw_gsm_path": "",
  "raw_sharegpt_path": "",
  "raw_swebench_path": "",

  // 压测前预热：ais_bench 自带的 --num-warmups 默认只发 1 条、顺序发送，
  // 请求数少的用例里首条冷请求会明显拉低均值。这里在正式压测前按用例并发
  // 再打几轮，把图捕获 / 显存池 / 连接池跑热，预热请求不计入统计。
  "warmup": {
    "enabled": false,     // 默认关闭；需要时改 true（会改变测量开始时的服务状态）
    "rounds": 2,          // 预热轮数；每轮并发数 = 用例并发
    "requests": 0,        // 覆盖总请求数；0 = rounds * 并发
    "concurrency": 0,     // 0 = 跟随用例并发
    "max_out_len": 0,     // 0 = 跟随用例输出长度
    "timeout": 600,       // 单条预热请求超时（秒）
    "sleep": 2.0,         // 预热结束后等待秒数，让服务侧队列收敛
    // false = 给预热 prompt 加随机后缀，避免把待测 prompt 的前缀缓存
    // 提前写进去（正式压测变成缓存命中，数据偏乐观）
    "reuse_prompts": false
  },

  // 传给 ais_bench 的 --num-warmups；0 = 关闭 ais_bench 自带预热
  "ais_num_warmups": 1
}
