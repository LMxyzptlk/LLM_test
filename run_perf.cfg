{
  "mode": "performance", // 运行模式：performance=拼接压测数据集，agent=原生 SWE-bench 评测
// ---------------Agent 模式配置-------------------
  "agent": {
    "dataset": "lite", // 数据集可选：lite / verified / full / multilingual
    "count": 1, // 取前 N 条；1=第 1 条，10=前 10 条，0=全部
    "step_limit": 200, // 单个 instance 的最大步数
    "work_dir": "outputs/agent", // 输出目录
    "run_mode": "all", // 运行阶段：infer=只推理，eval=只评测，all=推理+评测

    "model_cfg_params": { // 模型和服务配置
      "path": "/export/home/models/xxxxxx", // 模型路径，也用于加载 tokenizer
      "model": "", // 模型名
      "host_ip": "xxx.xxx.xxx.xxx", // xllm 服务 IP
      "host_port": 18004 // xllm 服务端口
    },

    "auto_prepare": true, // 自动准备 agent 环境
    "benchmark_repo": "https://gh-proxy.com/https://github.com/AISBench/benchmark.git", // benchmark 源码仓库
    "benchmark_dir": "", // benchmark 本地目录；留空则默认使用脚本目录下的 benchmark/
    "benchmark_ref": "", // benchmark 分支或 tag；留空表示默认分支
    "install_requirements": true // 是否自动安装 requirements/api.txt 和 requirements/extra.txt
  },
// ---------------Performance 模式配置-------------------
  "performance": {
    "dataset_dir": "datasets/performance", // 生成的压测数据集目录
    "result_dir": "results/performance", // 性能测试结果 xlsx 目录
    "input_len": [4096, 32768],  // 输入 token 长度列表
    "concurrencies": [1, 8, 16],// 并发数列表
    "default_max_out_len": null, // 默认输出长度；null 表示使用模型配置里的默认值 路径：../benchmark/ais_bench/benchmark/configs/models/vllm_api/vllm_api_general_stream.py
    "default_request_rate": null, // 默认请求速率；null 表示不改，0 表示尽量打满
    "default_pfx": null, // 默认前缀缓存共享比例；null 表示普通数据集

    "model_cfg_params": { // 模型和服务配置
      "path": "/export/home/models/xxxxxx", // 模型路径，也用于加载 tokenizer
      "model": "", // 模型名
      "host_ip": "xxx.xxx.xxx.xxx", // xllm 服务 IP
      "host_port": 18004 // xllm 服务端口
    },

    "dataset_types": [ "sharegpt"], // 数据集类型：gsm / sharegpt / swebench
    "raw_gsm_path": "", // GSM8K 原始数据路径；留空时自动下载到 raw_dataset_dir
    "raw_sharegpt_path": "/export/home/ext.liaopeiyi1/lpy/sharegpt/ShareGPT_V3_unfiltered_cleaned_split.json", // ShareGPT 原始数据路径；留空时自动下载到 raw_dataset_dir
    "raw_swebench_path": "", // SWE-bench 原始数据路径；留空时自动下载到 raw_dataset_dir
    "auto_prepare": true, // 自动准备 performance 环境和数据集
    "benchmark_repo": "https://gh-proxy.com/https://github.com/AISBench/benchmark.git", // benchmark 源码仓库
    "benchmark_dir": "", // benchmark 本地目录；留空则默认使用脚本目录下的 benchmark/
    "benchmark_ref": "", // benchmark 分支或 tag；留空表示默认分支
    "install_requirements": true, // 是否自动安装 requirements/api.txt 和 requirements/extra.txt
    "raw_dataset_dir": "raw_datasets", // 原始数据集默认下载目录
    "gsm8k_url": "http://opencompass.oss-cn-shanghai.aliyuncs.com/datasets/data/gsm8k.zip", // GSM8K 原始数据集下载地址
    "sharegpt_url": "https://hf-mirror.com/datasets/anon8231489123/ShareGPT_Vicuna_unfiltered/resolve/main/ShareGPT_V3_unfiltered_cleaned_split.json", // ShareGPT 原始数据集下载地址
    "swebench_url": "https://hf-mirror.com/datasets/princeton-nlp/SWE-bench/resolve/main/data/test-00000-of-00001.parquet" // SWE-bench 原始数据集下载地址
  }
}
