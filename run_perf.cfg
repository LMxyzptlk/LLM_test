{
  // 运行模式：
  // performance = 原有拼接压测数据集
  // agent       = 原生 SWE-bench 评测
  "mode": "performance",

  // agent 模式专用配置
  // 数据集可选：lite / verified / full / multilingual
  "agent_dataset": "lite",

  // 取前 N 条；1=第 1 条，10=前 10 条，0=全部
  "agent_count": 1,

  // agent 单个 instance 的最大步数
  "agent_step_limit": 200,

  // agent 模式输出目录
  "agent_work_dir": "outputs/agent",

  // performance 模式输出目录
  // 生成的压测数据集放到这里
  "performance_dataset_dir": "datasets/performance",

  // 性能测试结果 xlsx 放到这里
  "performance_result_dir": "results/performance",

  // performance 模式专用配置
  // 输入 token 长度列表
  "input_len": [
    32768
  ],

  // 并发数列表
  "concurrencies": [
    1,
    8,
    16
  ],

  // 默认输出长度；null 表示使用模型配置里的默认值
  "default_max_out_len": null,

  // 默认请求速率；null 表示不改，0 表示尽量打满
  "default_request_rate": null,

  // 默认前缀缓存共享比例；null 表示普通数据集
  "default_pfx": null,

  // 模型和服务配置
  // path：模型路径，也用于加载 tokenizer
  // model：模型名
  // host_ip / host_port：xllm 服务地址
  "model_cfg_params": {
    "path": "/export/home/models/xxxxxx",
    "model": "",
    "host_ip": "xxx.xxx.xxx.xxx",
    "host_port": 18004
  },

  // performance 模式使用的数据集类型：
  // gsm / sharegpt / swebench
  "dataset_types": [
    "sharegpt"
  ],

  // 原始数据集路径
  // 留空时，performance 模式会自动下载到 raw_dataset_dir
  "raw_gsm_path": "",
  "raw_sharegpt_path": "/export/home/ext.liaopeiyi1/lpy/sharegpt/ShareGPT_V3_unfiltered_cleaned_split.json",
  "raw_swebench_path": "",

  // 自动准备环境：缺失时自动下载/安装
  "auto_prepare": true,

  // benchmark 源码仓库
  "benchmark_repo": "https://gh-proxy.com/https://github.com/AISBench/benchmark.git",

  // benchmark 本地目录；留空则默认使用脚本目录下的 benchmark/
  "benchmark_dir": "",

  // benchmark 分支或 tag；留空表示默认分支
  "benchmark_ref": "",

  // 是否自动安装 requirements/api.txt 和 requirements/extra.txt
  "install_requirements": true,

  // 原始数据集默认下载目录
  "raw_dataset_dir": "raw_datasets",

  // 原始数据集下载地址
  "gsm8k_url": "http://opencompass.oss-cn-shanghai.aliyuncs.com/datasets/data/gsm8k.zip",
  "sharegpt_url": "https://hf-mirror.com/datasets/anon8231489123/ShareGPT_Vicuna_unfiltered/resolve/main/ShareGPT_V3_unfiltered_cleaned_split.json",
  "swebench_url": "https://hf-mirror.com/datasets/princeton-nlp/SWE-bench/resolve/main/data/test-00000-of-00001.parquet"
}
