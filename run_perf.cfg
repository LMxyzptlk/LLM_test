{
  "mode": "performance", // 单个或混合模式：performance / agent / accuracy；也可写成数组，如 ["agent", "performance", "accuracy"]
// ---------------Agent 模式配置-------------------
  "agent": {
    "dataset": "lite", // 数据集可选：lite / verified / full / multilingual
    "count": 1, // 取前 N 条；1=第 1 条，10=前 10 条，0=全部
    "step_limit": 200, // 单个 instance 的最大步数
    "work_dir": "outputs/agent", // 输出目录
    "run_mode": "all", // 运行阶段：infer=只推理，eval=只评测，all=推理+评测

    "model_cfg_params": { // 模型和服务配置
      "path": "/export/home/models/xxxxxx", // 模型路径，也用于加载 tokenizer
      "model": "", // 模型名
      "host_ip": "xxx.xxx.xxx.xxx", // xllm 服务 IP
      "host_port": 18004 // xllm 服务端口
    },

    "auto_prepare": true, // 自动准备 agent 环境
    "benchmark_repo": "https://gh-proxy.com/https://github.com/AISBench/benchmark.git", // benchmark 源码仓库
    "benchmark_dir": "", // benchmark 本地目录；留空则默认使用脚本目录下的 benchmark/
    "benchmark_ref": "", // benchmark 分支或 tag；留空表示默认分支
    "install_requirements": true // 是否自动安装 requirements/api.txt 和 requirements/extra.txt
  },
// ---------------Accuracy 精度测试模式配置-------------------
  "accuracy": {
    "dataset": "gpqa_diamond", // evalscope 数据集，当前使用 GPQA Diamond
    "eval_batch_size": 8, // 精度测试并发批次大小
    "work_dir": "outputs/accuracy", // 精度测试输出目录
    "auto_prepare": true, // 缺失 evalscope 时自动 pip install
    "model_cfg_params": { // 精度测试专用模型和服务配置
      "model": "", // 模型名
      "host_ip": "xxx.xxx.xxx.xxx", // xllm 服务 IP
      "host_port": 18004, // xllm 服务端口
      "api_key": "EMPTY" // OpenAI API Key
    },
    "generation_config": { // 生成参数
      "temperature": 1.0,
      "top_p": 0.95,
      "max_tokens": 130000,
      "timeout": 900,
      "retries": 2
    },
    "dataset_args": { // evalscope dataset-args
      "gpqa_diamond": {
        "filters": {
          "remove_until": "</think>"
        }
      }
    }
  },
// ---------------Performance 模式配置-------------------
  "performance": {
    "kind": "concat", // performance 子类型：concat=拼接压测，native_multiturn=AISBench 原生 ShareGPT 多轮压测

    "model_cfg_params": { // concat / native_multiturn 公共模型和服务配置
      "path": "/export/home/models/xxxxxx", // 模型路径，也用于加载 tokenizer
      "model": "", // 模型名
      "host_ip": "xxx.xxx.xxx.xxx", // xllm 服务 IP
      "host_port": 18004 // xllm 服务端口
    },

    "auto_prepare": true, // concat / native_multiturn 公共自动准备开关
    "benchmark_repo": "https://gh-proxy.com/https://github.com/AISBench/benchmark.git", // 公共 benchmark 源码仓库
    "benchmark_dir": "", // 公共 benchmark 本地目录
    "benchmark_ref": "", // 公共 benchmark 分支或 tag
    "install_requirements": true, // 公共依赖安装开关
    "raw_dataset_dir": "raw_datasets", // 公共原始数据下载目录
    "gsm8k_url": "http://opencompass.oss-cn-shanghai.aliyuncs.com/datasets/data/gsm8k.zip", // 公共 GSM8K 下载地址
    "sharegpt_url": "https://hf-mirror.com/datasets/anon8231489123/ShareGPT_Vicuna_unfiltered/resolve/main/ShareGPT_V3_unfiltered_cleaned_split.json", // 公共 ShareGPT 下载地址
    "swebench_url": "https://hf-mirror.com/datasets/princeton-nlp/SWE-bench/resolve/main/data/test-00000-of-00001.parquet", // 公共 SWE-bench 下载地址

    "concat": { // concat 拼接压测专属配置；native_multiturn 全部忽略
      "dataset_dir": "datasets/performance", // concat 生成的压测数据集目录
      "result_dir": "results/performance", // concat Excel 结果目录
      "input_len": [4096, 32768], // concat 输入 token 长度列表
      "concurrencies": [1, 8, 16], // concat 并发列表
      "default_max_out_len": null, // concat 默认输出长度；null 表示使用模型配置里的默认值
      "default_request_rate": null, // concat 默认请求速率；null 表示不改，0 表示尽量打满
      "default_pfx": null, // concat 前缀缓存比例；null 表示普通数据集
      "dataset_types": ["sharegpt"], // concat 数据集类型：gsm / sharegpt / swebench
      "raw_gsm_path": "", // concat GSM8K 原始数据路径
      "raw_sharegpt_path": "", // concat ShareGPT 原始数据路径
      "raw_swebench_path": "" // concat SWE-bench 原始数据路径
    },

    "native_multiturn": { // AISBench 原生 ShareGPT 多轮压测专属配置；concat 全部忽略
      "conversation_count": 100, // 取前 N 组有效多轮对话；0=全量，默认建议不要全量
      "infer_mode": "every", // every / last / every_with_gt
      "concurrencies": [1, 8, 16], // 原生多轮专属并发列表
      "max_out_len": 512, // 原生多轮专属单轮最大输出 token 数
      "request_rate": 0, // 原生多轮专属请求发送速率；0=尽量打满
      "work_dir": "outputs/performance/native_multiturn", // AISBench 原生输出目录
      "result_dir": "results/performance/native_multiturn", // Excel 结果目录
      "raw_sharegpt_path": "", // 原生多轮专属原始 ShareGPT 路径；留空使用 raw_dataset_dir 默认路径
      "generation_kwargs": { // 生成参数
        "temperature": 0.01,
        "ignore_eos": false
      }
    }
  }
}
