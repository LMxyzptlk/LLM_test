{
  // VLM 多模态精度测试专属配置
  // evalscope 数据集名；当前默认 MMMU-Pro test split（30 个学科，1730 题）
  "dataset": "mmmu_pro",

  // MMMU-Pro 数据集格式变体：
  //   standard (4 options)  —— 4 选项，evalscope 默认
  //   standard (10 options) —— 10 选项，难度更高
  //   vision                —— 题目嵌入图片，纯视觉理解
  // 其他数据集会忽略该字段
  "dataset_format": "standard (4 options)",

  // 数据集下载源：modelscope / huggingface
  "dataset_hub": "modelscope",

  // 只评测指定子集；留空表示全部 30 个子集
  // 可选值见 run_perf.py 里的 MMMU_SUBSET_LIST
  "subset_list": [],

  // 每个子集的评测数量：0=全量；整数=前 N 条；小数=百分比 (0,1]
  "limit": 0,

  // 每个样例重复推理次数
  "repeats": 1,

  // 带图请求吞吐较低，批次默认小于纯文本精度测试
  "eval_batch_size": 4,

  // 输出目录；evalscope 会在其下按时间戳建子目录
  "work_dir": "outputs/vlm",

  // 生成参数，传给 evalscope --generation-config
  "generation_config": {
    "temperature": 0.0, // 精度测试默认贪心解码
    "top_p": 1.0,
    "max_tokens": 16384, // 含 CoT，长答案需留足空间
    "timeout": 1800, // 带图请求耗时更长
    "retries": 2
  },

  // evalscope 数据集参数，传给 --dataset-args
  // 例如 {"mmmu_pro": {"dataset_id": "/path/to/MMMU_Pro"}} 可改用本地数据集
  "dataset_args": {}
}
