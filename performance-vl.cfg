{
  // VLM 多模态性能压测专属配置
  // evalscope perf 数据集；random_vl 会在线生成带随机色块图片的请求
  "dataset": "random_vl",

  // 并发列表，依次压测
  "concurrencies": [1, 8, 16, 32],

  // 每个并发的请求数：0=自动取 max(20, 并发*10)；整数=固定数量
  // 也可写成与 concurrencies 等长的数组，逐个指定
  "number": 0,

  // 输出 token 长度；压测一般固定长度，min=max 即固定长度输出
  "max_out_len": 128,
  "min_out_len": 128,

  // 文本 prompt 长度（token）
  "min_prompt_length": 100,
  "max_prompt_length": 100,

  // 前缀缓存重复长度（token）；0 表示不构造前缀
  "prefix_length": 0,

  // random_vl 图片参数
  "image_width": 512,
  "image_height": 512,
  "image_format": "RGB", // RGB / L / RGBA / P
  "image_num": 1, // 每条请求携带的图片数
  "image_patch_size": 28, // 与模型视觉 patch 对齐，影响视觉 token 数

  // 请求速率：-1 表示不限制，所有请求尽快发出
  "request_rate": -1,

  // 多并发轮次之间的等待秒数，避免服务未冷却就进入下一轮
  "sleep_interval": 5,

  // random_vl 需要 tokenizer 统计 prompt 长度；留空则用 model_cfg_params.path
  "tokenizer_path": "",

  // 输出目录；evalscope 会在其下按时间戳建子目录
  "work_dir": "outputs/performance/vl",

  // 汇总 CSV / JSON 输出目录
  "result_dir": "results/performance/vl",

  // 传给 evalscope --extra-args 的请求参数
  // ignore_eos=true 保证输出长度固定，便于对比吞吐
  "extra_args": {
    "ignore_eos": true
  }
}
