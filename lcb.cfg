{
  // LiveCodeBench 代码生成精度测试专属配置
  // 题库默认为脚本同级的 test6.jsonl（175 道竞赛题）

  // 题库文件；留空表示脚本同级 test6.jsonl，也可写绝对路径
  "data_file": "",

  // 题库下载地址：data_file 不存在时自动下载（约 129MB）
  // 留空表示不下载，直接报错
  "data_url": "https://hf-mirror.com/datasets/livecodebench/code_generation_lite/resolve/main/test6.jsonl",

  // LiveCodeBench 源码目录（其下应有 lcb_runner/）
  // 留空表示脚本同级 LiveCodeBench-main
  "source_dir": "",

  // 难度筛选：留空表示全部 175 题；可选 easy / medium / hard 任意组合
  // 例如 ["easy", "medium"]
  "difficulties": [],

  // 难度过滤后再取前 N 题，0 表示不限制（冒烟用）
  "limit": 0,

  // 并发请求数
  "concurrency": 8,

  // 单题最大生成 token 数，代码题需要留足长度
  "max_tokens": 65536,

  // 采样温度
  "temperature": 0.6,

  // 单题请求超时（秒）
  "request_timeout": 1200,

  // 单题判题超时（秒）
  "eval_timeout": 3600,

  // 请求重试
  "max_retries": 10,
  "retry_base_seconds": 30,
  "retry_max_seconds": 300,

  // 结果目录；每次运行在 work_dir 下按时间戳建子目录
  "work_dir": "outputs/lcb",

  // 汇总 CSV / JSON 输出目录
  "result_dir": "results/lcb",

  // 缺少 openai / datasets 时自动 pip install
  "auto_prepare": true
}
