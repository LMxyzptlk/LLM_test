{
  // Accuracy 模式专属配置
  // evalscope 数据集名；当前默认使用 GPQA Diamond
  "dataset": "gpqa_diamond",

  // 精度测试并发批次大小
  "eval_batch_size": 8,

  // 精度测试输出目录
  "work_dir": "outputs/accuracy",

  // 生成参数，传给 evalscope --generation-config
  "generation_config": {
    "temperature": 1.0, // 采样温度
    "top_p": 0.95, // nucleus sampling 参数
    "max_tokens": 130000, // 单次请求最大生成 token 数
    "timeout": 900, // 单次请求超时时间，单位秒
    "retries": 2 // 请求失败重试次数
  },

  // evalscope 数据集参数，传给 --dataset-args
  "dataset_args": {
    "gpqa_diamond": {
      "filters": {
        // 评分前截掉 </think> 之前的内容，只保留最终答案
        "remove_until": "</think>"
      }
    }
  }
}
