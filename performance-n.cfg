{
  // Performance native 原生多轮压测专属配置
  // 取前 N 组有效多轮对话；0 表示全量 ShareGPT
  "conversation_count": 100,

  // 多轮推理模式：
  // every          每一轮都发起请求并统计性能
  // last           只推理最后一轮
  // every_with_gt  每一轮推理并携带 ground truth
  "infer_mode": "every",

  // 原生多轮专属并发列表
  "concurrencies": [1, 8, 16],

  // 原生多轮专属单次请求最大输出 token 数
  "max_out_len": 512,

  // 原生多轮专属请求速率；0 表示尽量打满
  "request_rate": 0,

  // AISBench 原生输出目录
  "work_dir": "outputs/performance/native_multiturn",

  // Excel 结果目录
  "result_dir": "results/performance/native_multiturn",

  // 原生多轮专属原始 ShareGPT 路径；留空使用 raw_dataset_dir 默认路径
  "raw_sharegpt_path": "",

  // 生成参数
  "generation_kwargs": {
    "temperature": 0.01, // 采样温度
    "ignore_eos": false // 是否忽略 EOS，性能测试时可按需调整
  },

  // 压测前预热：按用例并发先打几轮多轮对话的首轮，把服务打热
  // （多轮用例请求数少、首轮上下文长，冷启动影响更明显）
  "warmup": {
    "enabled": false,     // 默认关闭；需要时改 true
    "rounds": 2,          // 预热轮数；每轮并发数 = 用例并发
    "requests": 0,        // 覆盖总请求数；0 = rounds * 并发
    "concurrency": 0,     // 0 = 跟随用例并发
    "max_out_len": 0,     // 0 = 跟随用例输出长度
    "timeout": 600,
    "sleep": 2.0,
    "reuse_prompts": false
  },

  // 传给 ais_bench 的 --num-warmups；0 = 关闭 ais_bench 自带预热
  "ais_num_warmups": 1
}
